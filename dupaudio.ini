; dupaudio configuration. Normally changed from the dupaudio tray icon menu.
; source = device whose sound is copied ("default" = Windows default output).
; output = a device that gets a copy (one line each).
; Values can be part of a device name or a full device ID (see dupaudio --list).
; Text after " ;" is just a label.

source=default

output=Bose
output={0.0.0.00000000}.{818ebd50-86b2-41ef-afac-697834232e9a}   ; Speakers (Realtek(R) Audio)

; Buffer per output in milliseconds (20-500). Raise to 80-100 if you hear crackles.
latency_ms=50
